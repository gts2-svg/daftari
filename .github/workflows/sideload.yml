name: sideload

# Builds an unsigned Daftari.ipa for installing through SideStore with a free
# Apple account, and publishes it on the "sideload" release so it can be
# downloaded on the phone. SideStore signs it on the device.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner (macos-26 or macos-15)"
        default: macos-26

permissions:
  contents: write

jobs:
  ipa:
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Daftari.xcodeproj -scheme Daftari -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Daftari.app || { tail -n 60 build.log; exit 1; }

      - name: Package ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Daftari.app ipa/Payload/
          # Apple's App ID name must be Latin letters; SideStore takes it from
          # the Info.plist name. The Arabic name still shows on the home screen
          # from ar.lproj/InfoPlist.strings.
          plutil -replace CFBundleDisplayName -string Daftari ipa/Payload/Daftari.app/Info.plist
          plutil -replace CFBundleName -string Daftari ipa/Payload/Daftari.app/Info.plist
          ls ipa/Payload/Daftari.app/ar.lproj
          cd ipa && zip -qry ../Daftari.ipa Payload && cd ..
          ls -la Daftari.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sideload --yes --cleanup-tag 2>/dev/null || true
          gh release create sideload Daftari.ipa \
            --title "دفتري — نسخة SideStore" \
            --notes "بناء رقم ${{ github.run_number }} (${GITHUB_SHA::7}). ثبّته من SideStore." \
            --latest
