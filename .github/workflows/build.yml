name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          set +e
          xcodebuild -project Daftari.xcodeproj -scheme Daftari -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          STATUS=$?
          tail -n 25 build.log
          grep -E "^/.*:[0-9]+:[0-9]+: error:" build.log | sort -u | head -45 > errors.txt
          echo "---- errors ($(wc -l < errors.txt)) ----"
          cat errors.txt
          echo "---- warnings ----"
          grep -E "^/.*:[0-9]+:[0-9]+: warning:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60
          while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1); l=$(echo "$line" | cut -d: -f2); m=$(echo "$line" | cut -d: -f5-)
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$l::$m"
          done < errors.txt
          exit $STATUS

      - name: Screenshots
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/Build/Products -name "Daftari.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          for s in today ideas packs pack nag morning settings; do
            xcrun simctl terminate "$UDID" com.gts2svg.daftari || true
            SIMCTL_CHILD_TZ=Asia/Riyadh xcrun simctl launch "$UDID" com.gts2svg.daftari -demo -screen "$s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$s.png"
          done
          ls -la "$RUNNER_TEMP/shots"

      - name: Publish screenshots to the screens branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screens
          git rm -rf . -q
          cp "$RUNNER_TEMP"/shots/*.png .
          git add *.png
          git commit -q -m "screenshots for ${GITHUB_SHA::7}"
          git push -f origin screens
